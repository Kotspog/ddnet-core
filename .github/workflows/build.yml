name: Build KernelNet

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Surgical Clean CMake Config
      shell: powershell
      run: |
        # Скачиваем чистый официальный файл конфигурации DDNet через встроенный PowerShell
        Invoke-WebRequest -Uri "https://githubusercontent.com" -OutFile "CMakeLists.txt"
        
        # Отключаем в нем падение из-за проверки версии
        (Get-Content CMakeLists.txt) -replace 'message\(FATAL_ERROR "Couldn\\x27t parse version from src\/game\/version.h"\)', 'message(STATUS "Skipping version check")' | Set-Content CMakeLists.txt
        (Get-Content CMakeLists.txt) -replace 'message\(SEND_ERROR "Couldn\\x27t parse version from src\/game\/version.h"\)', 'message(STATUS "Skipping version check")' | Set-Content CMakeLists.txt
        
        # Создаем пустые файлы-заглушки для недостающих компонентов
        New-Item -ItemType Directory -Force -Path src/game, cmake, other/versioninfo, other/manifest, src/manifest
        Set-Content -Path src/game/version.h -Value "#define GAME_VERSION `"0.0.1`"`n#define GAME_RELEASE_VERSION `"0.0.1`""
        New-Item -ItemType File -Force -Path cmake/checksummed_extra.txt, other/versioninfo/versioninfo.rc.in, other/manifest/client.manifest.in, src/manifest/client.manifest, cmake/Download_GTest_CMakeLists.txt.in

    - name: Install Libraries via Vcpkg
      run: |
        vcpkg install sdl2 curl freetype libpng openssl sqlite3 wavpack opus opusfile --triplet x64-windows

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DSERVER=OFF -DCLIENT=ON -DVULKAN=OFF -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build Game
      run: |
        cd build
        cmake --build . --config Release

    - name: Upload Finished Game
      uses: actions/upload-artifact@v4
      with:
        name: KernelNet-Windows-Build
        path: build/Release/
