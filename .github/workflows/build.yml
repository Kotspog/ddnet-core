name: Build KernelNet

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Bypass CMakeLists Completely
      shell: bash
      run: |
        # Создаем минимальный и чистый файл конфигурации, который просто собирает все файлы из src
        cat << 'EOF' > CMakeLists.txt
        cmake_minimum_required(VERSION 3.16)
        project(KernelNet VERSION 0.0.1 LANGUAGES C CXX)
        
        set(CMAKE_CXX_STANDARD 17)
        set(CMAKE_CXX_STANDARD_REQUIRED ON)
        
        # Находим все библиотеки через vcpkg
        find_package(SDL2 REQUIRED)
        find_package(CURL REQUIRED)
        find_package(Freetype REQUIRED)
        find_package(PNG REQUIRED)
        find_package(OpenSSL REQUIRED)
        find_package(SQLite3 REQUIRED)
        
        # Рекурсивно собираем абсолютно весь ваш кастомный код из папки src
        file(GLOB_RECURSE SOURCES "src/*.cpp" "src/*.c" "src/*.h")
        
        add_executable(DDNet ${SOURCES})
        
        # Привязываем библиотеки к исполняемому файлу
        target_link_libraries(DDNet PRIVATE 
            SDL2::SDL2 
            CURL::libcurl 
            Freetype::Freetype 
            PNG::PNG 
            OpenSSL::SSL 
            SQLite::SQLite3
            ws2_32 winmm
        )
        
        target_include_directories(DDNet PRIVATE src)
        EOF
        
        # Создаем заглушку файла версии, чтобы компилятор не ругался внутри кода
        mkdir -p src/game
        echo '#define GAME_VERSION "0.0.1"' > src/game/version.h
        echo '#define GAME_RELEASE_VERSION "0.0.1"' >> src/game/version.h

    - name: Install Libraries via Vcpkg
      run: |
        vcpkg install sdl2 curl freetype libpng openssl sqlite3 --triplet x64-windows

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DSERVER=OFF -DCLIENT=ON -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build Game
      run: |
        cd build
        cmake --build . --config Release

    - name: Upload Finished Game
      uses: actions/upload-artifact@v4
      with:
        name: KernelNet-Windows-Build
        path: build/Release/
