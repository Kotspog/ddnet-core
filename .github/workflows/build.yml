name: Build KernelNet

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Create Version Dummy
      shell: bash
      run: |
        mkdir -p src/game
        echo '#define GAME_VERSION "0.0.1"' > src/game/version.h
        echo '#define GAME_RELEASE_VERSION "0.0.1"' >> src/game/version.h

    - name: Install Libraries via Vcpkg
      run: |
        vcpkg install sdl2 curl freetype libpng openssl sqlite3 --triplet x64-windows

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build Game
      run: |
        cd build
        cmake --build . --config Release

    - name: Upload Finished Game
      uses: actions/upload-artifact@v4
      with:
        name: KernelNet-Windows-Build
        path: build/Release/
